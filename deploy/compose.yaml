# Development/hardening configuration. Do not assume this is a production agent backend.
name: xfree-studio
services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      BIND_ADDR: 0.0.0.0:8080
      CORS_ORIGIN: ${CORS_ORIGIN:?Set CORS_ORIGIN in deploy/.env}
      RUST_LOG: info
    expose: ["8080"]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    networks: [private]
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]
    networks: [private]
networks:
  private: {}
volumes:
  caddy_data: {}
  caddy_config: {}
